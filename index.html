<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#146d72"><title>Emma 免費英文口說老師 V2</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#16363b;background:#eaf3f3}*{box-sizing:border-box}body{margin:0}.app{max-width:560px;margin:auto;min-height:100dvh;background:#fff;padding:20px 18px 50px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;margin:0}.tag{font-size:12px;color:#08715a;background:#e4f8ed;border-radius:30px;padding:7px 10px}.sub{color:#60787c;font-size:13px;margin:8px 0 20px}.teacher{background:linear-gradient(135deg,#e0f5f3,#e9edff);border-radius:20px;padding:20px;display:flex;align-items:center;gap:16px}.avatar{font-size:54px;background:white;border-radius:50%;width:85px;height:85px;display:grid;place-items:center}.teacher strong{font-size:20px}.teacher p{margin:5px 0;font-size:13px;color:#49696c}.card{border:1px solid #dce8e8;border-radius:18px;padding:17px;margin-top:17px}.label{font-size:12px;color:#5d7779;margin-bottom:8px}.english{font-size:23px;font-weight:700;line-height:1.4}.chinese{color:#527276;margin:9px 0}.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button,select,input{font:inherit}button{border:0;border-radius:12px;background:#176f75;color:#fff;padding:12px 14px;font-weight:650;cursor:pointer}button.secondary{background:#e8f2f2;color:#18565c}button:disabled{opacity:.5}select{padding:10px;border:1px solid #d3e1e1;border-radius:10px;background:white;width:100%;margin-top:7px}.mic{width:100%;padding:18px;margin-top:15px;font-size:18px;background:#13757a}.mic.active{background:#c34747}.answer{padding:12px;border-radius:12px;background:#f0f7f7;margin-top:13px;min-height:46px;white-space:pre-wrap}.feedback{margin-top:10px;line-height:1.6;color:#365e61}.inputrow{display:flex;gap:8px;margin-top:10px}.inputrow input{flex:1;min-width:0;padding:12px;border:1px solid #d5e2e2;border-radius:10px}.inputrow button{flex-shrink:0}.progress{height:9px;background:#e6eeee;border-radius:9px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#21a99d;width:0%;transition:width .2s}.muted{font-size:12px;color:#607b7d;line-height:1.6}.status{font-size:13px;margin-top:9px;color:#566e70}.counter{font-size:13px;color:#4c6e70}footer{margin-top:24px;color:#678184;font-size:12px;line-height:1.7}</style></head><body><main class="app"><header><h1>🎧 Emma English</h1><span class="tag">V2 · 免費練習</span></header><p class="sub">每天 10 分鐘，聽得懂、說得出來</p><section class="teacher"><div class="avatar" aria-hidden="true">👩🏻‍🏫</div><div><strong>Emma 老師</strong><p>陪你練習生活英文</p><p>先聽，再說，最後看回饋</p></div></section><section class="card"><label for="scene" class="label">選擇練習情境</label><select id="scene"><option value="daily">日常問候</option><option value="cafe">咖啡店點餐</option><option value="travel">旅遊問路</option></select><div class="progress"><div id="fill" class="fill"></div></div><p class="counter" id="counter"></p></section><section class="card" aria-live="polite"><div class="label">Emma 問你</div><div class="english" id="en"></div><div class="chinese" id="zh"></div><div class="btnrow"><button id="speak">🔊 聽英文</button><button id="slow" class="secondary">🐢 慢速</button><button id="hint" class="secondary">💡 回答提示</button></div><div id="hintText" class="answer" hidden></div></section><section class="card"><div class="label">輪到你回答</div><button id="mic" class="mic">🎙️ 點我說英文</button><div id="status" class="status">若語音辨識無法使用，也能在下方輸入英文練習。</div><div class="inputrow"><input id="typed" aria-label="輸入英文回答" placeholder="輸入或說出你的英文回答"><button id="submit">送出</button></div><div id="answer" class="answer">你的回答會顯示在這裡。</div><div id="feedback" class="feedback" aria-live="polite"></div><div class="btnrow"><button id="next" class="secondary">下一題 →</button><button id="repeat" class="secondary">重新練習</button></div></section><section class="card"><strong>📈 學習紀錄</strong><p id="record" class="muted"></p><button id="reset" class="secondary">清除本機紀錄</button></section><footer>本版不使用付費 AI API，採用內建情境教材與規則式回饋。語音朗讀和辨識取決於裝置與瀏覽器；語音辨識可能由瀏覽器的線上服務處理，並不保證離線或完全不傳送音訊。這不是自由對話 AI，也不是精密的發音評分工具。請透過 HTTPS 網站開啟，以提高麥克風功能的可用性。</footer></main><script>
const lessons={daily:[{en:'Hello! How are you today?',zh:'你好！你今天過得如何？',hint:'I am fine, thank you.',words:['fine','good','great','okay','well','tired','happy'],tip:'你可以說：I am fine, thank you.（我很好，謝謝。）'},{en:'What is your name?',zh:'你叫什麼名字？',hint:'My name is Alex.',words:['name','i am','i’m','im'],tip:'你可以說：My name is ... 或 I am ...'},{en:'What do you like to do?',zh:'你喜歡做什麼？',hint:'I like reading.',words:['like','love','enjoy'],tip:'你可以說：I like reading.（我喜歡閱讀。）'}],cafe:[{en:'What would you like to drink?',zh:'你想喝什麼？',hint:'I would like a coffee, please.',words:['coffee','tea','water','juice','latte','drink'],tip:'點餐可以說：I would like a coffee, please.'},{en:'Would you like it hot or iced?',zh:'你要熱的還是冰的？',hint:'I would like it iced.',words:['hot','iced','cold'],tip:'回答：Hot, please. 或 Iced, please.'},{en:'Anything else?',zh:'還需要其他東西嗎？',hint:'No, thank you.',words:['no','yes','thank'],tip:'回答：No, thank you.（不用了，謝謝。）'}],travel:[{en:'Where would you like to go?',zh:'你想去哪裡？',hint:'I want to go to the station.',words:['station','hotel','airport','museum','go','park'],tip:'你可以說：I want to go to the station.'},{en:'Do you need directions?',zh:'你需要指路嗎？',hint:'Yes, please.',words:['yes','no','please'],tip:'回答：Yes, please.（好的，麻煩你。）'},{en:'Are you traveling alone?',zh:'你是一個人旅行嗎？',hint:'Yes, I am.',words:['yes','no','alone','family','friend'],tip:'回答：Yes, I am. 或 No, I am with my family.'}]};
const $=id=>document.getElementById(id);let scene='daily',idx=0,done=false,recognition=null;const key='emma_v2_progress';let stats={};try{stats=JSON.parse(localStorage.getItem(key)||'{}')}catch{};const save=()=>{try{localStorage.setItem(key,JSON.stringify(stats))}catch{}};function question(){return lessons[scene][idx]}function render(){const q=question();$('en').textContent=q.en;$('zh').textContent=q.zh;$('hintText').textContent='參考回答：'+q.hint;$('hintText').hidden=true;$('typed').value='';$('answer').textContent='你的回答會顯示在這裡。';$('feedback').textContent='';$('status').textContent='按麥克風說英文，或直接輸入回答。';$('counter').textContent=`第 ${idx+1} 題 / 共 ${lessons[scene].length} 題`;$('fill').style.width=((idx+1)/lessons[scene].length*100)+'%';done=false;record()}function record(){const s=stats[scene]||{attempts:0,matched:0};$('record').textContent=`「${$('scene').selectedOptions[0].text}」累計練習 ${s.attempts} 次，其中 ${s.matched} 次包含預設參考關鍵字。這是練習統計，不代表口說準確率。`}function say(rate){if(!('speechSynthesis'in window)){$('status').textContent='這個瀏覽器不支援語音朗讀。';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(question().en);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)}function submit(value){value=(value||'').trim();if(!value){$('feedback').textContent='請先說出或輸入一句英文。';return}$('typed').value=value;$('answer').textContent=value;const q=question(),normalized=value.toLowerCase().replace(/[’]/g,"'");const matched=q.words.some(w=>normalized.includes(w));if(!done){stats[scene]??={attempts:0,matched:0};stats[scene].attempts++;if(matched)stats[scene].matched++;save();done=true} $('feedback').textContent=(matched?'👍 你的回答包含這題的參考關鍵字。':'🌱 我還沒找到這題的參考關鍵字，但你的回答可能仍然正確。')+'\n'+q.tip+'\n注意：此版本無法判斷真正的發音準確度或完整文法。';record()}
$('scene').addEventListener('change',e=>{scene=e.target.value;idx=0;render()});$('speak').onclick=()=>say(.95);$('slow').onclick=()=>say(.7);$('hint').onclick=()=>{$('hintText').hidden=!$('hintText').hidden};$('submit').onclick=()=>submit($('typed').value);$('typed').addEventListener('keydown',e=>{if(e.key==='Enter')submit(e.target.value)});$('next').onclick=()=>{idx=(idx+1)%lessons[scene].length;render()};$('repeat').onclick=render;$('reset').onclick=()=>{if(confirm('確定清除所有學習紀錄？')){stats={};save();record()}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('mic').disabled=true;$('mic').textContent='此瀏覽器不支援語音辨識';$('status').textContent='請改用下方文字輸入；或在支援語音辨識的瀏覽器中透過 HTTPS 開啟。'}else{$('mic').onclick=()=>{if(recognition){recognition.stop();return}recognition=new SR();recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=e=>{const value=e.results[0][0].transcript;submit(value)};recognition.onerror=e=>{$('status').textContent='語音辨識失敗：'+e.error+'。可改用文字輸入。'};recognition.onend=()=>{recognition=null;$('mic').classList.remove('active');$('mic').textContent='🎙️ 點我說英文'};try{recognition.start();$('mic').classList.add('active');$('mic').textContent='⏹️ 停止聆聽';$('status').textContent='正在聽你說英文…'}catch(e){$('status').textContent='無法啟動麥克風，請檢查權限與 HTTPS。'}}}render();
</script></body></html>
